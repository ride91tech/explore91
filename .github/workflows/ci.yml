name: CI

# Roadmap 0.7. A pull request with a failing test must not merge green.
#
# Two things this deliberately does:
#
#   * Every run gets a FRESH MongoDB. The suite is not idempotent — it leaves
#     users, sessions and flags behind, and a second run against the same
#     database fails in ways the first did not. A throwaway service container
#     sidesteps that, and it is also what roadmap 0.2 asks for in staging.
#
#   * The backend suite runs in the mode pytest.ini configures (-n 2
#     --dist loadscope). It was pinned to serial with three Apple sign-in
#     tests deselected, because the suite was not isolated: tests handed ids
#     to each other, one swept every row matching a shared literal, and the
#     app's Motor client was bound to a single event loop so running the app
#     in-process under a second TestClient failed. Roadmap 0.9 fixed all
#     three, and the suite now passes repeatedly in both modes with nothing
#     excluded.


on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: explore91_ci
      # Never 'localhost': on some runners it resolves to ::1 first and each
      # new connection pays a ~2s fallback before reaching the IPv4 listener.
      TEST_BASE_URL: http://127.0.0.1:8000
      # No proxy in front of the API in CI, so X-Forwarded-For is pure client
      # input and must not be trusted. Production sets this to 1.
      TRUSTED_PROXY_HOPS: "0"
      ADMIN_EMAILS: ci-admin@explore91.dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Check the runtime set is self-sufficient
        working-directory: backend
        # The image installs requirements.txt only. If application code grows a
        # dependency that lives in requirements-dev.txt, the suite would still
        # pass here while the container failed to boot in production.
        run: |
          python -m venv /tmp/runtime-only
          /tmp/runtime-only/bin/pip install --quiet --upgrade pip
          /tmp/runtime-only/bin/pip install --quiet -r requirements.txt
          /tmp/runtime-only/bin/python -c "import server"

      - name: Start the API
        working-directory: backend
        run: |
          python -m uvicorn server:app --host 127.0.0.1 --port 8000 --log-level warning &
          echo $! > /tmp/api.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/ >/dev/null 2>&1; then
              echo "API up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy"; exit 1

      - name: Run the test suite
        working-directory: backend
        run: python -m pytest tests/ -q

      - name: API log on failure
        if: failure()
        run: kill -0 "$(cat /tmp/api.pid)" 2>/dev/null && echo "API still running" || echo "API had exited"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck (ratchet)
        working-directory: frontend
        # There are pre-existing type errors (icon glyphMap typings, a nullable
        # `user` in the admin layout). Failing outright would make CI red from
        # day one and train everyone to ignore it. Instead this holds the line:
        # the count may fall, never rise. Lower the baseline when you fix some.
        run: |
          BASELINE=11
          COUNT=$(npx tsc --noEmit 2>&1 | grep -c "error TS" || true)
          echo "TypeScript errors: $COUNT (baseline $BASELINE)"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::TypeScript errors rose from $BASELINE to $COUNT"
            npx tsc --noEmit 2>&1 | grep "error TS" || true
            exit 1
          fi
          if [ "$COUNT" -lt "$BASELINE" ]; then
            echo "::notice::Errors are down to $COUNT - lower BASELINE in .github/workflows/ci.yml"
          fi
