name: CI

# Roadmap 0.7. A pull request with a failing test must not merge green.
#
# Two things this deliberately does:
#
#   * Every run gets a FRESH MongoDB. The suite is not idempotent — it leaves
#     users, sessions and flags behind, and a second run against the same
#     database fails in ways the first did not. A throwaway service container
#     sidesteps that, and it is also what roadmap 0.2 asks for in staging.
#
#   * The backend suite runs in the mode pytest.ini configures (-n 2
#     --dist loadscope). It was pinned to serial with three Apple sign-in
#     tests deselected, because the suite was not isolated: tests handed ids
#     to each other, one swept every row matching a shared literal, and the
#     app's Motor client was bound to a single event loop so running the app
#     in-process under a second TestClient failed. Roadmap 0.9 fixed all
#     three, and the suite now passes repeatedly in both modes with nothing
#     excluded.


on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: explore91_ci
      # Never 'localhost': on some runners it resolves to ::1 first and each
      # new connection pays a ~2s fallback before reaching the IPv4 listener.
      TEST_BASE_URL: http://127.0.0.1:8000
      # Matches production (Cloud Run behind one Google front end). There is
      # no real proxy in CI, but the rate-limit regression tests simulate one
      # by sending "<spoofed>, <real>" — which is the exact shape Cloud Run
      # produces — so this is what exercises the production code path. With 0
      # the limiter ignores X-Forwarded-For, every caller shares one bucket,
      # and those tests cannot distinguish clients at all.
      TRUSTED_PROXY_HOPS: "1"
      ADMIN_EMAILS: ci-admin@explore91.dev
      # The Apple sign-in tests assert on the *configured* behaviour of
      # /auth/apple: 401 for a bad token, 429 past the rate limit. Without
      # this the endpoint short-circuits before any of that and they all fail
      # on the unconfigured path instead, which is not what they are testing.
      # These are public app identifiers — they ship inside the client binary
      # — so they belong here rather than in a secret.
      APPLE_AUDIENCES: com.explore91.app,host.exp.Exponent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Check the runtime set is self-sufficient
        working-directory: backend
        # The image installs requirements.txt only. If application code grows a
        # dependency that lives in requirements-dev.txt, the suite would still
        # pass here while the container failed to boot in production.
        run: |
          python -m venv /tmp/runtime-only
          /tmp/runtime-only/bin/pip install --quiet --upgrade pip
          /tmp/runtime-only/bin/pip install --quiet -r requirements.txt
          /tmp/runtime-only/bin/python -c "import server"

      - name: Start the API
        working-directory: backend
        run: |
          python -m uvicorn server:app --host 127.0.0.1 --port 8000 --log-level warning &
          echo $! > /tmp/api.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/ >/dev/null 2>&1; then
              echo "API up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy"; exit 1

      - name: Run the test suite
        working-directory: backend
        run: python -m pytest tests/ -q

      - name: API log on failure
        if: failure()
        run: kill -0 "$(cat /tmp/api.pid)" 2>/dev/null && echo "API still running" || echo "API had exited"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        # This was a ratchet against a baseline of 11 while the icon typings
        # and a nullable `user` in the admin layout were outstanding. Those are
        # fixed, so it is a plain gate now — any type error fails the build.
        #
        # The first CI run reported 14 where this machine reported 11. The
        # extra three were `segments[1]` on a 1-tuple: `useSegments()` is typed
        # from .expo/types/router.d.ts, which the dev server generates and
        # .gitignore excludes, so a developer machine and a clean checkout
        # disagreed. src/routing.ts removes that dependency. Do not "fix" a
        # future disagreement by generating the artifact here — if the check
        # needs a build artifact to pass, it is not checking the source.
        run: npx tsc --noEmit
