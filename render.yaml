services:
  - type: web
    name: explore91-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: explore91
      - key: APPLE_AUDIENCES
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: EMERGENT_LLM_KEY
        sync: false

  - type: web
    name: explore91-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npx expo export -p web
    staticPublishPath: dist
    envVars:
      # Set this to the backend service's public URL after it's deployed
      # (shown on its Render dashboard page), e.g. https://explore91-backend.onrender.com
      - key: EXPO_PUBLIC_BACKEND_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
