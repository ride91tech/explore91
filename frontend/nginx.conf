server {
    listen       ${PORT};
    server_name  _;
    root         /usr/share/nginx/html;

    # expo-router builds a single-page app, so deep links like /admin/audit
    # have no file on disk. Without this fallback they 404 on direct load or
    # refresh — the routes only work when reached by in-app navigation.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Hashed filenames are content-addressed, so they can be cached hard.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or clients keep booting an old bundle
    # after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip              on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # The admin console shouldn't be embeddable by other sites.
    add_header X-Frame-Options       "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
